<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: dark;
    --ink: #12131a;
    --panel: #1b1d26;
    --line: #2a2d3a;
    --text: #e8e6e1;
    --muted: #8a8fa0;
    --brass: #e0a552;
    --signal: #4ade80;
    --off: #f26d6d;
  }

  * { box-sizing: border-box; }

  body {
    width: 296px;
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* ---- baslik ---- */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px 11px;
    border-bottom: 1px solid var(--line);
  }

  .mark {
    display: flex;
    align-items: baseline;
    gap: 7px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .19em;
    text-transform: uppercase;
  }
  .mark b { color: var(--brass); font-weight: 700; }

  .state {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    letter-spacing: .04em;
    color: var(--muted);
  }
  .led {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--off);
  }
  .led.on { background: var(--signal); box-shadow: 0 0 0 3px rgba(74,222,128,.16); }

  /* ---- imza: sancak seklinde kart ---- */
  .banner {
    margin: 14px 16px 16px;
    padding: 12px 14px 15px;
    background: var(--panel);
    border-left: 3px solid var(--brass);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 9px), 0 100%);
  }
  .banner .eyebrow {
    font-size: 9.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 5px;
  }
  .banner .title {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .banner .meta {
    margin-top: 3px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .banner.idle .title { color: var(--muted); font-weight: 400; font-size: 12.5px; }

  /* ---- satirlar ---- */
  .group { padding: 0 16px; }

  .legend {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 4px 0 2px;
    font-size: 9.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .legend::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
  }
  .row + .row { border-top: 1px solid rgba(42,45,58,.55); }
  .row .label { min-width: 0; }
  .row .sub { display: block; font-size: 10.5px; color: var(--muted); }

  .divider { height: 1px; background: var(--line); margin: 10px 0; }

  /* ---- anahtar ---- */
  .sw { position: relative; width: 32px; height: 19px; flex: none; }
  .sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .sw i {
    position: absolute; inset: 0;
    background: #3a3e4d; border-radius: 10px;
    transition: background .16s ease;
    pointer-events: none;
  }
  .sw i::after {
    content: ""; position: absolute; left: 2px; top: 2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--text);
    transition: transform .16s ease;
  }
  .sw input:checked + i { background: var(--brass); }
  .sw input:checked + i::after { transform: translateX(13px); background: var(--ink); }
  .sw input:focus-visible + i { outline: 2px solid var(--text); outline-offset: 2px; }

  .off { opacity: .45; }

  .foot {
    padding: 11px 16px 14px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    margin-top: 8px;
  }
  .foot:empty { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .sw i, .sw i::after { transition: none; }
  }
</style>
</head>
<body>
  <div class="top">
    <div class="mark"><b>◤</b> Herald</div>
    <div class="state"><span class="led" id="led"></span><span id="stateText">Connecting</span></div>
  </div>

  <div class="banner idle" id="banner">
    <div class="eyebrow" id="eyebrow">Standing by</div>
    <div class="title" id="bannerTitle">Play something and it shows up here</div>
    <div class="meta" id="bannerMeta"></div>
  </div>

  <div class="group">
    <div class="row">
      <div class="label"><strong>Announcing</strong></div>
      <label class="sw"><input type="checkbox" id="enabled"><i></i></label>
    </div>
    <div class="row">
      <div class="label">Hide details<span class="sub">Show only the site name</span></div>
      <label class="sw"><input type="checkbox" id="hideTitle"><i></i></label>
    </div>

    <div class="divider"></div>
    <div class="legend">Sites</div>
    <div id="sites"></div>
  </div>

  <div class="foot" id="foot"></div>

  <script src="popup.js"></script>
</body>
</html>
